name: PrimitiveAppTemplate
options:
  bundleIdPrefix: com.primitivelabs
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  PrimitiveApp:
    path: ../swift-primitive-app
targets:
  PrimitiveAppTemplate:
    type: application
    platform: [iOS, macOS]
    sources:
      - Sources/PrimitiveAppTemplate
      - path: primitive.json
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    entitlements:
      path: PrimitiveAppTemplate.entitlements
    dependencies:
      - package: PrimitiveApp
        product: PrimitiveApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.primitivelabs.PrimitiveAppTemplate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Signing -- set DEVELOPMENT_TEAM to your Apple Team ID to enable
        # code signing. Leave empty for unsigned dev builds.
        # Find your Team ID: https://developer.apple.com/account -> Membership Details
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2J4V27W63D"
    scheme:
      testTargets: []
      gatherCoverageData: false
