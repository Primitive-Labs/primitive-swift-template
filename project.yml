name: PrimitiveAppTemplate
options:
  bundleIdPrefix: com.primitivelabs
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
# Project-level default, so any target added later inherits the Swift 6
# language mode instead of xcodegen's built-in 5.0 (#2310).
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  PrimitiveApp:
    url: https://github.com/Primitive-Labs/swift-primitive-app.git
    branch: alpha
  # Direct dep so the codegen phase below (and `run-ios.sh`) can
  # `swift run swift-bao-codegen` against the same package graph the
  # SPM plugin uses.
  JsBaoClient:
    url: https://github.com/Primitive-Labs/swift-client.git
    branch: alpha
targets:
  PrimitiveAppTemplate:
    type: application
    platform: [iOS, macOS]
    sources:
      # `models.toml` is consumed at *build time* by `swift-bao-codegen`
      # and inlined into the generated `*Record.swift` files — exclude
      # it from the Xcode source scan so it doesn't end up bundled as
      # an app resource.
      - path: Sources/PrimitiveAppTemplate
        excludes:
          - "**/Models/models.toml"
          # `Models/Generated/README.md` documents the dir for source
          # control; it's not a build input. Without this exclude
          # xcodegen treats it as a resource and bundles it into the
          # .app — harmless but wasteful.
          - "**/Models/Generated/README.md"
      # A BUILD PRODUCT, not a tracked file: generated from the selected
      # Primitive environment in .primitive/config.json by the pre-build phase
      # below (#2873). The path is non-optional to xcodegen, which is why
      # scripts/regenerate-project.sh generates it before running xcodegen.
      - path: primitive.json
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    # `swift build` regenerates `Models/Generated/` through the SwiftPM
    # codegen plugin, but the Xcode target compiles the source list in
    # `.pbxproj`, where no plugin runs. Without this phase, Xcode's Run
    # button, a bare `xcodebuild` and CI all compiled whatever structs the
    # last `./run-ios.sh` happened to leave behind (#2886).
    #
    # `models.toml` in, a stamp out: with both declared, Xcode's dependency
    # analysis skips the phase entirely while the schema is untouched, so a
    # normal incremental build pays nothing for it.
    preBuildScripts:
      - name: Generate models from models.toml
        basedOnDependencyAnalysis: true
        inputFiles: [$(SRCROOT)/Sources/PrimitiveAppTemplate/Models/models.toml]
        outputFiles: [$(DERIVED_FILE_DIR)/models-codegen.stamp]
        script: bash "$SRCROOT/scripts/generate-models.sh" --verify-project
      # Re-resolve primitive.json on EVERY build, before Copy Bundle Resources
      # runs. Building straight from Xcode (Run, Profile, Archive) must pick up
      # the current `primitive env use` selection — a phase that could be
      # skipped would let a build ship the environment a previous one resolved.
      #
      # The declared inputs/outputs are what let this run inside Xcode's user
      # script sandbox: a phase may read its declared inputs and write its
      # declared outputs. The template therefore leaves script sandboxing at
      # Xcode's default and never disables it — turning it off in every
      # scaffolded app to save a build-time file write would be a bad trade,
      # especially in a template whose entitlements deliberately turn app
      # sandboxing ON. A static test pins that the setting never appears here.
      #
      # `basedOnDependencyAnalysis: false` is about always running, not about
      # incrementality: the declared I/O exists for sandbox access.
      #
      # The resolver script itself is an input: `bash <script>` READS it out of
      # the source tree, which the sandbox denies unless it is declared.
      - name: Resolve Primitive environment
        script: bash "$SRCROOT/scripts/resolve-primitive-config.sh"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/resolve-primitive-config.sh
          - $(SRCROOT)/.primitive/config.json
          - $(SRCROOT)/.primitive/local.json
        outputFiles:
          - $(SRCROOT)/primitive.json
    entitlements:
      path: PrimitiveAppTemplate.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # network.server lets sandboxed macOS builds bind the DebugInspector's NWListener.
        # Harmless in release (release excludes DebugInspector entirely via #if DEBUG).
        com.apple.security.network.server: true
    dependencies:
      - package: PrimitiveApp
        product: PrimitiveApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.primitivelabs.PrimitiveAppTemplate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Debug-only: PrimitiveApp's DebugInspector advertises an HTTP server over Bonjour
        # so a dev's Mac browser can hit the app's debug UI over Wi-Fi. iOS gates all local
        # network traffic behind a one-time permission prompt; the Info.plist keys below make
        # the prompt appear on first launch. Harmless in release — the listener itself only
        # runs in DEBUG. NSBonjourServices is array-valued and Xcode's auto-generator ignores
        # it, so it lives in Info-Partial.plist; Xcode merges that with the generated keys.
        INFOPLIST_FILE: Info-Partial.plist
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Expose the debug inspector to your Mac browser over Wi-Fi (DEBUG builds only)."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Match the SPM manifest's `swiftLanguageModes: [.v6]` (#2310). Both
        # build paths compile the SAME `Sources/PrimitiveAppTemplate` files —
        # `./run-ios.sh` through xcodebuild, `./build.sh` / `./run.sh` through
        # SPM — so a split here would mean Xcode accepts code that `swift build`
        # rejects.
        SWIFT_VERSION: "6.0"
        # Signing -- set DEVELOPMENT_TEAM to your Apple Team ID to enable
        # code signing. Empty value works for the iOS Simulator (unsigned dev
        # builds) but cannot be deployed to a real device or TestFlight.
        # To set it later: edit DEVELOPMENT_TEAM below, then re-run ./run-ios.sh
        # (xcodegen regenerates the .xcodeproj from this file).
        # Find your Team ID: https://developer.apple.com/account -> Membership Details
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
      gatherCoverageData: false
