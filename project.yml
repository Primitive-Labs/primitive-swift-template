name: PrimitiveAppTemplate
options:
  bundleIdPrefix: com.primitivelabs
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
# Project-level default, so any target added later inherits the Swift 6
# language mode instead of xcodegen's built-in 5.0 (#2310).
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  # The client, and the `swift-bao-codegen` tool the codegen phase below runs
  # (`swift run` against this same package graph).
  JsBaoClient:
    url: https://github.com/Primitive-Labs/swift-client.git
    branch: alpha
targets:
  PrimitiveAppTemplate:
    type: application
    platform: [iOS, macOS]
    sources:
      # `bao-codegen.json` names the db3 type file codegen reads, and
      # `Models/Generated/README.md` documents the directory; neither is a
      # build input. Without these excludes xcodegen treats them as resources
      # and bundles them into the .app.
      - path: Sources/PrimitiveAppTemplate
        excludes:
          - "**/bao-codegen.json"
          - "**/Models/Generated/README.md"
      # A BUILD PRODUCT, not a tracked file: generated from the selected
      # Primitive environment in primitive/config.json by the pre-build phase
      # below (#2873). The path is non-optional to xcodegen, which is why
      # scripts/regenerate-project.sh generates it before running xcodegen.
      - path: primitive.json
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    # The Xcode target compiles the source list in `.pbxproj`, so without
    # this phase Xcode's Run button, a bare `xcodebuild` and CI would compile
    # whatever `Models/Generated/` the last scripted build left behind (#2886).
    #
    # Both generated classes, on EVERY Xcode entry point (#3078) — Run,
    # Profile, Archive, a bare `xcodebuild` on a fresh clone. The phase runs
    # `scripts/codegen.sh`, the same entry point every scripted build path uses,
    # so no entry point regenerates a different subset from another.
    #
    # `basedOnDependencyAnalysis: false` — it runs on every build, on purpose:
    # an upgraded generator or CLI must regenerate even when no input changed,
    # and the file lists below are refreshed BY this phase, so they describe
    # the previous build. Always running is what makes that one-build lag
    # harmless.
    #
    # What it costs: a warm `swift run` of the model codegen, plus one CLI
    # launch when the selected environment has synced functions.
    #
    # The declared I/O is ordering and hygiene, not a sandbox workaround: what a
    # codegen reads and writes depends on the app's configuration — which
    # schema, which environment, which synced TOMLs — so the config-dependent
    # halves are declared through committed `.xcfilelist` files that
    # `codegen.sh` rewrites. File-list PATHS are what the project embeds, so the
    # declaration stays valid while the contents change. The scripts themselves
    # are static inputs: `bash <script>` READS them out of the source tree.
    #
    # `$(DERIVED_FILE_DIR)/codegen.stamp` is written by `codegen.sh` itself, and
    # only after both generators, the list refresh and the verification have
    # succeeded — no failure path may mark the phase clean.
    preBuildScripts:
      - name: Generate code from schemas
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/codegen.sh
          - $(SRCROOT)/scripts/generate-models.sh
          - $(SRCROOT)/scripts/codegen-env.sh
          - $(SRCROOT)/scripts/verify-generated-project.sh
          # The codegen input line, statically as well as in the generated
          # list: it always exists, and it names the db3 type file (if any),
          # which the generated list carries.
          - $(SRCROOT)/Sources/PrimitiveAppTemplate/bao-codegen.json
        inputFileLists:
          - $(SRCROOT)/scripts/codegen-inputs.xcfilelist
        outputFileLists:
          - $(SRCROOT)/scripts/codegen-outputs.xcfilelist
        outputFiles: [$(DERIVED_FILE_DIR)/codegen.stamp]
        script: bash "$SRCROOT/scripts/codegen.sh" --verify-project
      # Re-resolve primitive.json on EVERY build, before Copy Bundle Resources
      # runs. Building straight from Xcode (Run, Profile, Archive) must pick up
      # the current `primitive env use` selection — a phase that could be
      # skipped would let a build ship the environment a previous one resolved.
      #
      # The declared inputs/outputs are what let this run inside Xcode's user
      # script sandbox: a phase may read its declared inputs and write its
      # declared outputs. The template therefore leaves script sandboxing at
      # Xcode's default and never disables it — turning it off in every
      # scaffolded app to save a build-time file write would be a bad trade,
      # especially in a template whose entitlements deliberately turn app
      # sandboxing ON. A static test pins that the setting never appears here.
      #
      # `basedOnDependencyAnalysis: false` is about always running, not about
      # incrementality: the declared I/O exists for sandbox access.
      #
      # The resolver script itself is an input: `bash <script>` READS it out of
      # the source tree, which the sandbox denies unless it is declared.
      #
      # `.primitive/config.json` is the PRE-#3153 anchor. The script never
      # reads it — it stats it and refuses the build, naming both anchors.
      # Declared so that stat is permitted by contract with the sandbox
      # on: the profile denies `file-read*` under $SRCROOT and re-allows each
      # declared input, and an undeclared anchor is only as visible as that
      # profile happens to make it — when it is not, an unmigrated project is
      # told its configuration is missing when the file is merely in the old
      # place (#3343). A migrated project has no such file, exactly as it may
      # have no `.primitive/local.json`.
      - name: Resolve Primitive environment
        script: bash "$SRCROOT/scripts/resolve-primitive-config.sh"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/resolve-primitive-config.sh
          - $(SRCROOT)/primitive/config.json
          - $(SRCROOT)/.primitive/local.json
          - $(SRCROOT)/.primitive/config.json
        outputFiles:
          - $(SRCROOT)/primitive.json
    entitlements:
      path: PrimitiveAppTemplate.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Universal links (#2982) — the emailed https sign-in link opening THIS
        # app instead of the browser. Uncomment and name your web domain once
        # BOTH of these are true, in this order:
        #
        #   1. https://<your-web-domain>/.well-known/apple-app-site-association
        #      is deployed and verified (200, application/json, no redirect —
        #      the web template ships the file and the checklist under
        #      public/.well-known/). Apple's CDN caches what it fetches, so an
        #      entitlement added before the document is live buys a cached miss.
        #   2. This target has a real DEVELOPMENT_TEAM: an associated domain is
        #      checked against the app's team + bundle id, so it cannot be
        #      signed with the empty team the template ships.
        #
        # com.apple.developer.associated-domains:
        #   - applinks:your-web-domain.com
        #   # Native passkeys use the same file (#929):
        #   # - webcredentials:your-web-domain.com
    dependencies:
      - package: JsBaoClient
        product: JsBaoClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.primitivelabs.PrimitiveAppTemplate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Orientations, spelled out because the Info.plist is GENERATED: with
        # no INFOPLIST_KEY_UISupportedInterfaceOrientations* setting the plist
        # named none, and xcodegen's iOS preset claims iPad
        # (TARGETED_DEVICE_FAMILY "1,2"), so App Store Connect rejected the
        # first upload of every scaffolded app — "No orientations were
        # specified … To support iPad multitasking" (90474, #3010).
        #
        # The lists are Xcode's own new-app defaults. iPad takes all four:
        # multitasking is what the validator is asking about. Narrowing the
        # app to iPhone (TARGETED_DEVICE_FAMILY: "1") is the other legal
        # answer — then the _iPad list is unused, not optional-with-iPad.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # The app's URL type is array-valued, which Xcode's Info.plist
        # generator cannot express, so it lives in Info-Partial.plist, along
        # with the optional PrimitiveOAuthRedirectURI key; Xcode merges that
        # file with the generated keys.
        INFOPLIST_FILE: Info-Partial.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Match the SPM manifest's `swiftLanguageModes: [.v6]` (#2310). Both
        # build paths compile the SAME `Sources/PrimitiveAppTemplate` files —
        # `./run-ios.sh` through xcodebuild, `./build.sh` / `./run.sh` through
        # SPM — so a split here would mean Xcode accepts code that `swift build`
        # rejects.
        SWIFT_VERSION: "6.0"
        # Signing -- set DEVELOPMENT_TEAM to your Apple Team ID to enable
        # code signing. Empty value works for the iOS Simulator (unsigned dev
        # builds) but cannot be deployed to a real device or TestFlight.
        # To set it later: edit DEVELOPMENT_TEAM below, then re-run ./run-ios.sh
        # (xcodegen regenerates the .xcodeproj from this file).
        # Find your Team ID: https://developer.apple.com/account -> Membership Details
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
      gatherCoverageData: false
  # The XCUITest suite `./ui-test.sh` runs on a dedicated simulator. Xcode-only:
  # SwiftPM never sees `UITests/`, so `swift build` and `./test.sh` are
  # unaffected.
  PrimitiveAppTemplateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/PrimitiveAppTemplateUITests
    dependencies:
      - target: PrimitiveAppTemplate_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.primitivelabs.PrimitiveAppTemplateUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
# The UI suite has its own iOS scheme instead of a test action on the app's:
# the app target is multi-platform, so a test target listed in its scheme
# lands in the macOS scheme too, where an iOS-only bundle cannot build.
schemes:
  PrimitiveAppTemplateUITests:
    build:
      targets:
        PrimitiveAppTemplate_iOS: all
        PrimitiveAppTemplateUITests: [test]
    test:
      targets:
        - PrimitiveAppTemplateUITests
      gatherCoverageData: false
